# Source ranges the paper cites. scripts/src_anchors.py resolves each anchor
# in the tree it runs in and writes src/figures/generated/anchors_macros.tex;
# --check fails when an anchor no longer matches exactly one line.

[read_gzip]
file = "src/compression.rs"
fn = "open_decoded"
start = 'Compression::Gzip => Box::new\(flate2'

[read_zstd]
file = "src/compression.rs"
fn = "open_decoded"
start = 'zstd::stream::read::Decoder::new'

[read_plain]
file = "src/compression.rs"
start = 'Compression::None if metadata\.len\(\) < MMAP_THRESHOLD'
end = 'FileContents::Mapped\(mmap\)'

[thread_choice]
file = "src/iterators.rs"
start = '^pub fn frames_from_bytes\('
end = "block"

[boundary_walk]
file = "src/iterators.rs"
start = '^fn equal_span_boundaries\('
end = "block"

[parallel_parse]
file = "src/iterators.rs"
parts = [
  { start = '^fn parse_frames_parallel_bytes', end = "block" },
  { start = '^pub fn parse_frames_parallel\(', end = "block" },
]

[read_indexed]
file = "src/iterators.rs"
start = '^pub fn read_all_frames_indexed'
end = "block"

[trajectory_open]
file = "src/trajectory.rs"
start = '^\s*pub fn open\(path: &Path, write_index: bool\)'
end = "block"

[header_line_two]
file = "src/iterators.rs"
parts = [
  { start = 'self\.lines\.bytes\.starts_with\("\\u\{feff\}"\.as_bytes\(\)\)' },
]

[header_check]
file = "src/parser.rs"
start = '^pub fn parse_frame_header<'
end = "block"

[frame_body]
file = "src/parser.rs"
start = '^pub\(crate\) fn parse_single_frame_ls'
end = "block"

[coordinate_rows]
file = "src/parser.rs"
start = '^fn ingest_coord_rows'
end = "block"

[finite_number]
file = "src/parser.rs"
parts = [
  { start = '^fn parse_finite_float_token', end = "block" },
  { start = '^fn parse_fixed_flag', end = "block" },
]

[real_cell]
file = "src/parser.rs"
start = '^fn validate_header_geometry'
end = "block"

[legacy_velocity]
file = "src/iterators.rs"
start = '^fn probe_section\('
end = "block"

[declared_sections]
file = "src/parser.rs"
parts = [
  { start = '^pub fn parse_declared_sections', end = "block" },
  { start = '^fn skip_unknown_section', end = "block" },
]

[velocity_time]
file = "src/parser.rs"
start = '^fn reject_velocities_without_time'
end = "block"

[replace_file]
file = "src/frame_index.rs"
start = '^fn write_encoded\('
end = "block"

[rcbin_copy]
file = "src/conbin.rs"
parts = [
  { start = '^fn header_fields', end = "block" },
  { start = '^fn f64_payload', end = "block" },
]

[rcbin_crc]
file = "src/conbin.rs"
start = '^fn checked_payload_offset'
end = "block"
