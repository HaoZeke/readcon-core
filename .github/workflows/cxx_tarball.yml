name: cxx source tarball

# Attaches slim + vendor cxx tarballs after cargo-dist publishes the
# GitHub Release. Slim URL is the FetchContent / wrapdb default.
# cbindgen is not installed and not invoked.
#
# The Release workflow creates the GitHub Release with GITHUB_TOKEN, and
# events raised by GITHUB_TOKEN start no workflows, so `release: published`
# never fired for v0.15.0 through v0.17.2. Run when the Release workflow
# finishes on a tag push instead; head_branch is then the tag name.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to checkout and attach cxx tarballs to
        required: true
        type: string

permissions:
  contents: write

jobs:
  cxx-tarball:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Assemble slim and vendor cxx tarballs
        run: |
          mkdir -p dist-cxx
          bash scripts/package-cxx.sh dist-cxx
          bash scripts/package-cxx.sh dist-cxx --vendor
          ls -lh dist-cxx

      - name: Upload tarballs to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist-cxx/readcon-core-cxx-*.tar.gz
            dist-cxx/readcon-core-cxx-*.tar.gz.sha256
          fail_on_unmatched_files: true
          append_body: true
          body: |
            C/C++ source tarballs: `readcon-core-cxx-$VERSION.tar.gz` (FetchContent / wrap default) and `readcon-core-cxx-$VERSION-vendor.tar.gz` (offline crates). Headers are pre-generated; cbindgen is not required.
